name: Bright Moments DAO
description: >-
  Bright Moments is an onchain art organization and decentralized autonomous
  organization (DAO) that produces live, in-person (IRL) generative NFT minting
  experiences in cities around the world. Its flagship CryptoCitizens collection
  (10,000 Art Blocks-powered generative portraits by artist Qian Qian) was minted
  1,000 at a time across ten cities including Venice CA (CryptoVenetians), New York,
  Berlin, London, Mexico City, Tokyo, Buenos Aires, Paris, Venice Italy, and the
  Metaverse. Holding a CryptoCitizen confers membership and governance rights in the
  Bright Moments DAO, which was founded on-chain in March 2021. Bright Moments also
  runs artist collaborations/residencies, a Golden Token minting mechanism, and
  display software for at-home viewing. It is not a traditional API provider: the
  public technical surface is Ethereum/Base smart contracts, a documentation site,
  a DAO portal app, and a public GitHub organization. This profile was surfaced as a
  portfolio company of Union Square Ventures.
